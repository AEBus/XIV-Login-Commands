name: Create Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    if: ${{ !startsWith(github.ref_name, 'testing_') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.x.x
            9.x.x

      - name: Restore dependencies
        run: dotnet restore FFXIVLoginCommands.sln

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/stg/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev\"

      - name: Build
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}' -replace '^v'
          dotnet build FFXIVLoginCommands.sln --no-restore --configuration Release --nologo -p:Platform=x64 -p:Version=$ver -p:FileVersion=$ver -p:AssemblyVersion=$ver

      - name: Archive
        shell: pwsh
        run: Copy-Item -LiteralPath "FFXIVLoginCommands/bin/x64/Release/FFXIVLoginCommands/latest.zip" -Destination "FFXIVLoginCommands.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FFXIVLoginCommands-Release
          path: ./FFXIVLoginCommands.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: FFXIV Login Commands ${{ github.ref_name }}
          body: |
            - Updated for Dalamud API 15 / FFXIV Patch 7.5.
            - Existing login command configuration and execution behavior are unchanged.
          files: ./FFXIVLoginCommands.zip
          prerelease: false
